# Docker Compose configuration for Telestration

services:
  frontend:
    build: ./frontend
    container_name: telestration-frontend
    ports:
      - "5173:5173"
    # Anonymous volume keeps host node_modules out of the bind mount; the image CMD
    # runs `npm install` on start so new dependencies from package.json are applied.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: telestration-backend
    env_file:
      - ./backend/.env
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  db:
    image: postgres:13-alpine
    container_name: postgres-db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
